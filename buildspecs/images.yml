version: 0.2
# Stage 2: build the four step images, push to ECR, resolve digests.
env:
  variables:
    PROJECT: pv-yolov8
  exported-variables:
    - IMAGE_TAG
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --no-cache-dir boto3 PyYAML
  pre_build:
    commands:
      - export ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - export AWS_REGION="${AWS_DEFAULT_REGION:-us-east-1}"
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:8}"
      - echo "building tag ${IMAGE_TAG} into ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
  build:
    commands:
      # PrivilegedMode must be true on this CodeBuild project (docker-in-docker).
      - TAG="$IMAGE_TAG" ACCOUNT_ID="$ACCOUNT_ID" ./scripts/build_and_push.sh --tag "$IMAGE_TAG"
  post_build:
    commands:
      - python scripts/resolve_digests.py --tag "$IMAGE_TAG" --account-id "$ACCOUNT_ID" --output build/images.json
      - cat build/images.json
artifacts:
  files:
    - build/images.json
    - infra/*.yaml
    - pipelines/**/*
    - src/**/*
    - config/**/*
    - requirements.txt
  name: images
